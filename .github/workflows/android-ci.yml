# CI de la app Android (T141, HU-38): en cada push y pull request a main corre lint,
# las pruebas unitarias y el build de debug. Sin app/google-services.json ni local.properties
# (no se versionan) la app compila igual: Firebase queda apagado y las claves usan sus
# valores de relleno, así que el CI no necesita ningún secreto.
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint + pruebas unitarias + build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # gradle/gradle-daemon-jvm.properties pide JetBrains 21 para el daemon de Gradle.
      - name: JDK 21 (JetBrains)
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"

      # El repo no versiona gradlew: se usa la misma versión que gradle-wrapper.properties.
      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Lint
        run: gradle :app:lintDebug --console=plain

      - name: Pruebas unitarias
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Build de debug
        run: gradle :app:assembleDebug --console=plain

      # R8 solo corre en release: sin este paso una regla de proguard-rules.pro rota (o un DTO
      # que R8 renombra) no se vería hasta publicar. La URL es pública y solo se compila.
      - name: Build de release (R8)
        run: gradle :app:assembleRelease -PRELEASE_API_BASE_URL=https://api.urbanblade.com.mx/api/v1/ --console=plain

      - name: Reportes de lint y pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-android
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
